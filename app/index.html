<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>TQ Reactor</title>
</head>

<body id="body">
  <div id="root"></div>
  <script>
    const scripts = [];
    // относительный путь: каждый dev-экземпляр грузит бандл со своего сервера
    // (жёсткий :8000 заставлял все экземпляры делить один HMR-канал)
    scripts.push(
      '/dist/renderer.dev.js'
    );
    document.write(
      scripts
        .map(script => {
          return `<script defer src="${script}"><\/script>`
        })
        .join('')
    );
  </script>
</body>

</html>
