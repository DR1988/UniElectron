name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (without scripts)
        run: npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # Заголовки Electron и rebuild нативных модулей делает сам electron-builder
      # (в шагах Build и Package): node-hid 3.x / serialport 13 — NAPI с prebuilds.

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Package (electron-builder)
        run: npx electron-builder --linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: release/
