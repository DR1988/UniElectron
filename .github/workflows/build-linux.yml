name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # права на создание GitHub Release при пуше тега (автообновление по сети)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (without scripts)
        run: npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # Заголовки Electron и rebuild нативных модулей делает сам electron-builder
      # (в шагах Build и Package): node-hid 3.x / serialport 13 — NAPI с prebuilds.
      # hidapi (libusb-бэкенд) в node-hid компилируется из исходников и требует
      # системные заголовки libusb/libudev, которых нет в образе ubuntu-latest
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Package (electron-builder)
        run: npx electron-builder --linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: release/
