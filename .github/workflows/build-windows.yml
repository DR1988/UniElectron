name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (without scripts)
        run: npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Prepare Electron headers (patch common.gypi)
        run: |
          $cache = Join-Path $env:USERPROFILE '.electron-gyp\12.0.6'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          curl.exe -L -o "$env:TEMP\e12-headers.tar.gz" 'https://artifacts.electronjs.org/headers/dist/v12.0.6/node-v12.0.6-headers.tar.gz'
          tar -xzf "$env:TEMP\e12-headers.tar.gz" -C $env:TEMP
          Copy-Item -Recurse -Force "$env:TEMP\node_headers\*" $cache
          $gypi = Join-Path $cache 'include\node\common.gypi'
          $c = Get-Content $gypi -Raw
          $c = $c.Replace("    'openssl_fips%': '',", "    'openssl_fips%': '',`n    'openssl_fips': '',")
          Set-Content -Path $gypi -Value $c -NoNewline

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Package (electron-builder)
        run: npx electron-builder --win

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release/
