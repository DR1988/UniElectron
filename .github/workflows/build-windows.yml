name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    # права на создание GitHub Release при пуше тега (автообновление по сети)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (without scripts)
        run: npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # Заголовки Electron и rebuild нативных модулей делает сам electron-builder
      # (в шагах Build и Package): node-hid 3.x / serialport 13 — NAPI с prebuilds.

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Package (electron-builder)
        run: npx electron-builder --win
        # токен для публикации в GitHub Release (проверка draft-релиза идёт даже без тега)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release/
